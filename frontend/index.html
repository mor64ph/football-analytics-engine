<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1117" />

    <!-- Primary SEO -->
    <title>ScoutIQ — Football Transfer Value & Match Predictor</title>
    <meta name="description" content="Free football analytics platform. Model-derived player valuations across Premier League, LaLiga, Serie A, Bundesliga and Ligue 1, plus Elo-based match predictions with measured accuracy." />
    <meta name="keywords" content="football transfer value, player market value, football analytics, match predictor, Premier League valuation, LaLiga stats, Serie A analytics, Bundesliga data, Ligue 1, Elo football prediction" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://scoutiq-eta.vercel.app/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scoutiq-eta.vercel.app/" />
    <meta property="og:title" content="ScoutIQ — Football Transfer Value & Match Predictor" />
    <meta property="og:description" content="See where the transfer market misprices players. XGBoost valuations across 15,374 player-seasons and Elo match predictions across 38,983 matches — with accuracy honestly reported." />
    <meta property="og:site_name" content="ScoutIQ" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ScoutIQ — Football Transfer Value & Match Predictor" />
    <meta name="twitter:description" content="Model-derived player valuations and match predictions across Europe's top five leagues. Accuracy measured, not claimed." />

    <!-- Structured data: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ScoutIQ",
      "url": "https://scoutiq-eta.vercel.app/",
      "description": "Football analytics platform providing model-derived transfer valuations and match outcome predictions for Europe's top five leagues.",
      "applicationCategory": "SportsApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" },
      "featureList": [
        "Player transfer value model (XGBoost)",
        "Match outcome predictor (Elo + Dixon-Coles)",
        "League comparison across Premier League, LaLiga, Serie A, Bundesliga, Ligue 1",
        "Undervalued player rankings",
        "Prediction accuracy tracking"
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load Inter without blocking first paint. The browser renders with the
         system font, then swaps to Inter once it arrives. -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          onload="this.rel='stylesheet'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
